name: Test USDA FoodData Central connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fdc:
    runs-on: ubuntu-latest
    steps:
      - name: Verify FDC_API_KEY is configured
        env:
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
        run: |
          if [ -z "$FDC_API_KEY" ]; then
            echo "::error::FDC_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Test FoodData Central API
        env:
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
        run: |
          HTTP_CODE=$(curl --silent --show-error --output /tmp/fdc-response.json --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"query":"chicken breast","pageSize":1}' \
            "https://api.nal.usda.gov/fdc/v1/foods/search?api_key=$FDC_API_KEY")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::USDA FoodData Central request failed with HTTP $HTTP_CODE."
            exit 1
          fi

          python - <<'PY'
          import json
          with open("/tmp/fdc-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          foods = data.get("foods", [])
          if not foods:
              raise SystemExit("USDA connection succeeded, but the test search returned no foods.")
          first = foods[0]
          print("USDA FoodData Central connection successful.")
          print("Test result:", first.get("description", "Unnamed food"))
          print("FDC ID:", first.get("fdcId", "not returned"))
          PY
